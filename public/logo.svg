<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180">
  <rect width="640" height="180" rx="20" fill="#1a1a2e"/>

  <!-- Grass block icon -->
  <g>
    <polygon points="80,33 129,59 80,85 31,59" fill="#6FA83A" stroke="#00000030" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="31,59 80,85 80,138 31,111" fill="#5A3B22" stroke="#00000030" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="129,59 80,85 80,138 129,111" fill="#8B5E3C" stroke="#00000030" stroke-width="0.75" stroke-linejoin="round"/>
    <polygon points="31,59 80,85 80,96 31,70" fill="#4A7228"/>
    <polygon points="129,59 80,85 80,96 129,70" fill="#6FA83A"/>
  </g>

  <!-- Wordmark -->
